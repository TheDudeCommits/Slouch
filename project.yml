name: Slouch
options:
  bundleIdPrefix: com.amirthedude69
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
targets:
  Slouch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Slouch
    dependencies:
      - sdk: SceneKit.framework
      - sdk: ARKit.framework
      - sdk: Vision.framework
      - sdk: AVFoundation.framework
      - sdk: GameKit.framework
      - sdk: CoreMotion.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirthedude69.slouch
        PRODUCT_NAME: Slouch
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Slouch
        INFOPLIST_KEY_NSCameraUsageDescription: Slouch uses the front camera to turn gentle head and neck movements into private, on-device game controls. Camera images are never recorded or uploaded.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Slouch/Resources/Slouch.entitlements
    scheme:
      testTargets:
        - SlouchTests
      gatherCoverageData: true
  SlouchTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SlouchTests
    dependencies:
      - target: Slouch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirthedude69.slouch.tests
        GENERATE_INFOPLIST_FILE: YES
